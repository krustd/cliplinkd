[package]
name = "krust-cliplinkd"
version = "0.1.1"
edition = "2021"
description = "ClipLink daemon — receive text from mobile and auto-paste on desktop"
license = "MIT"
repository = "https://github.com/krustd/cliplinkd"
readme = "README.md"
keywords = ["clipboard", "paste", "lan", "desktop", "mobile"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "cliplinkd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
arboard = "3"
enigo = "0.1"
socket2 = { version = "0.5", features = ["all"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
hostname = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
objc2 = "0.5"
objc2-foundation = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = "2"
zbus = { version = "4", default-features = false, features = ["blocking", "tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
] }

[profile.release]
opt-level = "s"     # optimize for size
lto = true           # link-time optimization
strip = "symbols"    # strip debug symbols
codegen-units = 1    # better optimization
